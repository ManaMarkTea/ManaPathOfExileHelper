  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="48" fill="none" stroke="#af6025" stroke-width="4" opacity="0.55"/>

  <!-- faceted gem -->
  <g>
    <polygon points="128,46 176,92 152,92" fill="url(#gemLight)"/>
    <polygon points="128,46 80,92 104,92" fill="url(#gem)"/>
    <polygon points="80,92 104,92 128,210 62,120" fill="#9c6420"/>
    <polygon points="176,92 152,92 128,210 194,120" fill="#c98a2c"/>
    <polygon points="104,92 152,92 128,210" fill="url(#gemLight)"/>
    <polygon points="80,92 62,120 104,92" fill="#7a4a17"/>
    <polygon points="176,92 194,120 152,92" fill="#b87826"/>
